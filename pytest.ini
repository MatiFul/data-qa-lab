[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: comprueba que la infraestructura mínima esté disponible
    quality: valida reglas de calidad e integridad de datos
    known_defect: documenta una regla actualmente incumplida por el dataset controlado
    api: valida contratos HTTP y respuestas de la API
