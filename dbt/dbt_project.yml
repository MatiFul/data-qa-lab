name: data_qa_lab
version: 1.0.0
config-version: 2

profile: data_qa_lab

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  max_inconsistency_rate: 0.05

models:
  data_qa_lab:
    staging:
      +materialized: view
      +schema: dbt_staging
    marts:
      +materialized: table
      +schema: dbt_marts
