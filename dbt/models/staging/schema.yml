version: 2

models:
  - name: stg_transactions
    description: Vista tipada y renombrada de las transacciones curadas.
    columns:
      - name: transaction_id
        description: Identificador único de la transacción.
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null
      - name: transaction_amount
        data_tests:
          - not_null
      - name: transaction_date
        data_tests:
          - not_null

  - name: stg_transaction_items
    description: Vista tipada del detalle de productos por transacción.
    columns:
      - name: item_id
        description: Identificador único de la línea de detalle.
        data_tests:
          - not_null
          - unique
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_transactions')
                field: transaction_id
      - name: quantity
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
