version: 2

models:
  - name: int_valid_transactions
    description: Transacciones que aprobaron las reglas técnicas y referenciales.
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: transaction_amount
        data_tests:
          - not_null
      - name: transaction_date
        data_tests:
          - not_null

  - name: int_rejected_transactions
    description: Transacciones rechazadas, conservadas con el motivo de rechazo.
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: rejection_reason
        data_tests:
          - not_null

  - name: int_valid_transaction_items
    description: Ítems válidos pertenecientes a transacciones y productos existentes.
    columns:
      - name: item_id
        data_tests:
          - not_null
          - unique
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_valid_transactions')
                field: transaction_id
      - name: item_amount
        data_tests:
          - not_null

  - name: int_rejected_transaction_items
    description: Ítems rechazados, conservados con el motivo de rechazo.
    columns:
      - name: item_id
        data_tests:
          - not_null
          - unique
      - name: rejection_reason
        data_tests:
          - not_null

  - name: int_transaction_item_totals
    description: Totales de ítems calculados por transacción para reutilizar en marts.
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - unique
      - name: item_count
        data_tests:
          - not_null
      - name: calculated_item_amount
        data_tests:
          - not_null
