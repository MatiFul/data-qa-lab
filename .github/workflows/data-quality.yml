name: Data quality gates

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: dbt and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: qa_lab
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QA_DB_HOST: 127.0.0.1
      QA_DB_PORT: "5432"
      QA_DB_NAME: qa_lab
      QA_DB_USER: qa_user
      QA_DB_PASSWORD: qa_pass

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-generator.txt
            requirements-dev.txt
            requirements-dbt.txt

      - name: Install dependencies
        run: >-
          python -m pip install
          --requirement requirements-generator.txt
          --requirement requirements-dev.txt
          --requirement requirements-dbt.txt

      - name: Generate deterministic dataset
        run: python data_generator/generate_dataset.py

      - name: Build PostgreSQL layers
        run: python scripts/bootstrap_postgres.py

      - name: Run quality gates
        run: python scripts/run_quality_checks.py

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
